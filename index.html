<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <a href="#">
            <img src="teste.webp"  class="logotipo">
        </a>
    </header>

    <div class="bloco-central">
        <div class="caixa-login">
            <h1>Faça login ou crie uma conta</h1>
            <div class="campo">
                <label for="identificacao">E-mail ou número de telefone celular</label>
                <input type="text" id="identificacao" name="identificacao" autocomplete="username">
                <button  class="botao-primario">Continuar</button>
            </div>
            <p class="termos">
                Ao continuar, você concorda com as <a href="#">Condições de Uso</a> e a <a href="#">Notificação de Privacidade</a> da Amazon.
            </p>
            <div class="link-ajuda">
                <a href="#">Precisa de ajuda?</a>
            </div>
        </div>
       
    </div>

    <footer class="rodape">
        <div class="links-rodape">
            <a href="#">Condições de Uso</a>
            <a href="#">Notificação de Privacidade</a>
            <a href="#">Ajuda</a>
            <a href="#">Cookies</a>
            <a href="#">Anuncios Baseados em Interesses</a>
        </div>
        <p class="direitos-autorais">&copy; 1996-2026, Amazon.com, Inc. ou suas afiliadas</p>
    </footer>
</body>
</html>
