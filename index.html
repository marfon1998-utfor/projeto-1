<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <a href="#">
            <img src="teste.webp"  class="logotipo">
        </a>
    </header>

    <div class="bloco-central">
        <div class="caixa-login">
            <h1>Fazer login</h1>
            <div class="campo">
                <label>E-mail ou número de telefone celular</label>
                <input type="text">
                <button  class="botao-primario">Continuar</button>
            </div>
            <p class="termos">
                Ao continuar, você concorda com as <a href="#">Condições de Uso</a> e a <a href="#">Notificação de Privacidade</a> da Amazon.
            </p>
            <div class="link-ajuda">
                <a href="#">Precisa de ajuda?</a>
            </div>
        </div>
        <div class="divisor">
            <span>Novo na Amazon?</span>
        </div>
        <a href="#" class="botao-secundario">Criar sua conta da Amazon</a>
    </div>
    <footer class="rodape">
        <div class="links-rodape">
            <a href="#">Condições de Uso</a>
            <a href="#">Notificação de Privacidade</a>
            <a href="#">Ajuda</a>
        </div>
        <p class="direitos-autorais">&copy; 1996-2026, Amazon.com, Inc. ou suas afiliadas</p>
    </footer>
</body>
</html>
